---
apiVersion: v1alpha1
kind: CRICustomizationConfig
name: unprivileged
content: |-
  [plugins]
    [plugins."io.containerd.grpc.v1.cri"]
      enable_unprivileged_ports = true
      enable_unprivileged_icmp = true
  [plugins."io.containerd.grpc.v1.cri".containerd]
    discard_unpacked_layers = false
  [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
    discard_unpacked_layers = false
---
apiVersion: v1alpha1
kind: EtcFileConfig
name: nfsmount.conf
mode: 0o644
contents: |
  # No hard=True here: mount.nfs appends it after the volume's own options, so
  # it overrides soft on the static volumes (radarr/sonarr external-media).
  # hard is already the kernel default for every other mount.
  [ NFSMount_Global_Options ]
  nfsvers=4.1
  noatime=True
  nconnect=16

  # External media VM content export: NFSv4.0 only, on a non-standard port
  # (kubelet inline NFS volumes cannot set one). external-library.piscio.net,
  # same VM, uses the defaults above.
  [ Server "external-media.piscio.net" ]
  nfsvers=4.0
  port=20490
