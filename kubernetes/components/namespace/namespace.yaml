---
apiVersion: v1
kind: Namespace
metadata:
  name: not-used
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
    # Report pods that would fail the baseline Pod Security Standard without blocking them.
    # Switch to enforce per namespace once the warnings are cleared.
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
