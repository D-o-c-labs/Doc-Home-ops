---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./networkpolicy.yaml
configMapGenerator:
  - name: kometa-config
    files:
      - config/config.yml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # Kometa uses <<...>> placeholders; keep Flux substitution off this file.
    kustomize.toolkit.fluxcd.io/substitute: disabled
