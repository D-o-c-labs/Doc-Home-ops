---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kometa
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kometa-secret
    creationPolicy: Owner
  data:
    - secretKey: KOMETA_PLEX_TOKEN
      remoteRef:
        key: Plex
        property: token
    - secretKey: KOMETA_TMDB_APIKEY
      remoteRef:
        key: tmdb
        property: api_key
