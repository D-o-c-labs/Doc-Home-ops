---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-cache
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi
  storageClassName: ceph-block
---
# Remote download folder, read-only, served by the external media VM as NFSv3
# on port 20491. Static volume: the Talos nfsmount.conf section for this host
# forces NFSv4.0 on 20490, which only explicit mount options override. nolock
# and mountport keep it to that one port (no rpcbind, no lock manager). Soft
# like the external-media volume: a read that never returns fails with EIO
# after about 90 seconds instead of hanging the process. Safe because read-only.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-remote-library
spec:
  capacity:
    storage: 1Mi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=3
    - proto=tcp
    - port=20491
    - mountproto=tcp
    - mountport=20491
    - nolock
    - ro
    - soft
    - timeo=150
    - retrans=2
  nfs:
    server: external-media.piscio.net
    path: /
    readOnly: true
  claimRef:
    namespace: media
    name: plex-remote-library
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-remote-library
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 1Mi
  storageClassName: ""
  volumeName: plex-remote-library
