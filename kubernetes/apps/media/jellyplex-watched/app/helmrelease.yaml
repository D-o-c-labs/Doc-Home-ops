---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyplex-watched
spec:
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-labs
        namespace: flux-system
  interval: 30m
  dependsOn:
    - name: plex
      namespace: media
    - name: jellyfin
      namespace: media
  values:
    controllers:
      jellyplex-watched:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          labels:
            # plex.tv is needed to resolve Plex users and their tokens.
            egress.home.arpa/internet: allow
            egress.home.arpa/kubedns: allow # FIXME: Remove when clusterNetworkPolicy is in place
          securityContext:
            runAsUser: ${APP_UID}
            runAsGroup: ${APP_GID}
            runAsNonRoot: true
            fsGroup: ${APP_GID}
            fsGroupChangePolicy: "OnRootMismatch"

        containers:
          app:
            image:
              repository: ghcr.io/luigi311/jellyplex-watched
              tag: 8.5.3
            # 8.5.3 reads only environment variables (or a .env file): the
            # tokens and the user mapping come from the secret below.
            env:
              DRYRUN: "${JPW_DRYRUN}"
              DEBUG_LEVEL: INFO
              RUN_ONLY_ONCE: "False"
              SLEEP_DURATION: "3600"
              LOG_FILE: /tmp/jpw/log.log
              MARK_FILE: /tmp/jpw/mark.log
              REQUEST_TIMEOUT: "300"
              MAX_THREADS: "1"
              GENERATE_GUIDS: "True"
              GENERATE_LOCATIONS: "True"
              PLEX_BASEURL: http://plex.media.svc.cluster.local:32400
              JELLYFIN_BASEURL: http://jellyfin.media.svc.cluster.local:8096
              # Plex and Jellyfin name the same libraries differently.
              LIBRARY_MAPPING: '{"Film": "Movies", "Programmi TV": "Shows"}' # yamllint disable-line rule:quoted-strings
              WHITELIST_LIBRARY: Film,Programmi TV,Movies,Shows
              WHITELIST_LIBRARY_TYPE: movie,show,movies,tvshows
              SYNC_FROM_PLEX_TO_JELLYFIN: "True"
              SYNC_FROM_JELLYFIN_TO_PLEX: "True"
              SYNC_FROM_PLEX_TO_PLEX: "False"
              SYNC_FROM_JELLYFIN_TO_JELLYFIN: "False"
              SYNC_FROM_PLEX_TO_EMBY: "False"
              SYNC_FROM_JELLYFIN_TO_EMBY: "False"
              SYNC_FROM_EMBY_TO_PLEX: "False"
              SYNC_FROM_EMBY_TO_JELLYFIN: "False"
              SYNC_FROM_EMBY_TO_EMBY: "False"
            envFrom:
              - secretRef:
                  name: jellyplex-watched-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
