---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyplex-watched
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: jellyplex-watched-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Environment variables for jellyplex-watched (see the HelmRelease).
        PLEX_TOKEN: "{{ .plex_token }}"
        JELLYFIN_TOKEN: "{{ .jellyfin_api_key }}"
        # JSON object {"plex user": "jellyfin user"}, kept in 1Password to keep
        # usernames out of this repo; "{}" when every username matches.
        USER_MAPPING: "{{ .user_mapping }}"
  data:
    - secretKey: plex_token
      remoteRef:
        key: Plex
        property: token
    - secretKey: jellyfin_api_key
      remoteRef:
        key: jellyfin
        property: api_key
    - secretKey: user_mapping
      remoteRef:
        key: jellyplex-watched
        property: user_mapping
