---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyplex-watched
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: jellyplex-watched-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Bidirectional watched-state sync between Plex and Jellyfin.
        # Libraries must have the same names on both servers.
        # user_mappings lives in 1Password as a YAML block list ("[]" when
        # every username matches) to keep usernames out of this repo.
        # yamllint disable rule:quoted-strings
        config.yaml: |
          dryrun: ${JPW_DRYRUN}
          debug_level: INFO
          run_only_once: false
          sleep_duration: 3600
          log_file: /tmp/jpw/log.log
          mark_file: /tmp/jpw/mark.log
          request_timeout: 300
          max_threads: 1
          generate_guids: true
          generate_locations: true

          blacklist_users: []
          whitelist_users: []
          blacklist_libraries: []
          whitelist_libraries: ["Films", "Series"]
          blacklist_library_types: ["music", "photos"]
          whitelist_library_types: ["movie", "show", "movies", "tvshows"]

          plex:
            - name: plex
              baseurl: http://plex.media.svc.cluster.local:32400
              sync_to: [jellyfin]
              token: "{{ .plex_token }}"
              ssl_bypass: false

          jellyfin:
            - name: jellyfin
              baseurl: http://jellyfin.media.svc.cluster.local:8096
              sync_to: [plex]
              token: "{{ .jellyfin_api_key }}"

          user_mappings:
          {{ .user_mappings | indent 2 }}
        # yamllint enable rule:quoted-strings
  data:
    - secretKey: plex_token
      remoteRef:
        key: Plex
        property: token
    - secretKey: jellyfin_api_key
      remoteRef:
        key: jellyfin
        property: api_key
    - secretKey: user_mappings
      remoteRef:
        key: jellyplex-watched
        property: user_mappings
