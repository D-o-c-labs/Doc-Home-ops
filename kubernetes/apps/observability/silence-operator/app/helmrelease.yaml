---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: silence-operator
spec:
  chartRef:
    kind: OCIRepository
    name: silence-operator
  interval: 30m
  values:
    alertmanagerAddress: http://alertmanager-operated.observability.svc.cluster.local:9093
    image:
      # The chart defaults the tag to .Chart.Version, which Flux suffixes with the OCI digest (0.20.0+ff704465ac61)
      # renovate: datasource=docker depName=gsoci.azurecr.io/giantswarm/silence-operator
      tag: 0.21.1
    networkPolicy:
      enabled: false
