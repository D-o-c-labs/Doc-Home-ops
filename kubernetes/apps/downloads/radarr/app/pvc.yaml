---
# Read-only content tree served by the external media VM (Decypharr, NFSv4.0 on
# port 20490). A static volume instead of an inline one so it can be mounted
# soft: a read that TorBox never answers fails with EIO after about 90 seconds
# (timeo 15 s, linear backoff, 2 retries) instead of hanging ffprobe and the
# whole import queue in uninterruptible sleep. Safe because the mount is
# read-only. nosharecache keeps it apart from the hard mounts of Plex and
# Jellyfin on the same node. Talos nfsmount.conf adds only defaults that do not
# clash with these (no global hard).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: radarr-external-media
spec:
  capacity:
    storage: 1Mi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.0
    - port=20490
    - ro
    - soft
    - timeo=150
    - retrans=2
    - nosharecache
  nfs:
    server: external-media.piscio.net
    path: /
    readOnly: true
  claimRef:
    namespace: downloads
    name: radarr-external-media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-external-media
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 1Mi
  storageClassName: ""
  volumeName: radarr-external-media
---
# Remote download folder, read-only, served by the external media VM as NFSv3
# on port 20491. Static volume: the Talos nfsmount.conf section for this host
# forces NFSv4.0 on 20490, which only explicit mount options override. nolock
# and mountport keep it to that one port (no rpcbind, no lock manager). Soft
# like the external-media volume: a read that never returns fails with EIO
# after about 90 seconds instead of hanging the process. Safe because read-only.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: radarr-remote-library
spec:
  capacity:
    storage: 1Mi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=3
    - proto=tcp
    - port=20491
    - mountproto=tcp
    - mountport=20491
    - nolock
    - ro
    - soft
    - timeo=150
    - retrans=2
  nfs:
    server: external-media.piscio.net
    path: /
    readOnly: true
  claimRef:
    namespace: downloads
    name: radarr-remote-library
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-remote-library
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 1Mi
  storageClassName: ""
  volumeName: radarr-remote-library
