---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-labs
        namespace: flux-system
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph

  values:
    controllers:
      prowlarr:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          labels:
            egress.home.arpa/internet: allow
            egress.home.arpa/kubedns: allow # FIXME: Remove when clusterNetworkPolicy is in place
            ingress.home.arpa/gateway-route: allow
          securityContext:
            runAsUser: ${APP_UID}
            runAsGroup: ${APP_GID}
            fsGroup: ${APP_GID}
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image: &image
              repository: ghcr.io/home-operations/prowlarr
              tag: 2.7.0.5723@sha256:fcf7498692f97698ea8b8f7078a0f81120a16e7354e4c232b5e3810e3e783dff
            env:
              PROWLARR__INSTANCE_NAME: Prowlarr
              PROWLARR__PORT: &port 9696
              PROWLARR__LOG_LEVEL: info
              PROWLARR__ANALYTICS_ENABLED: "False"
              PROWLARR__AUTHENTICATION_METHOD: External
              PROWLARR__API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: prowlarr-secret
                    key: api_key

            resources:
              requests:
                cpu: 18m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

        initContainers:
          # Torrentio custom definition (it can return only releases cached on
          # TorBox). Pinned to an upstream commit; a failed download keeps the
          # copy already on the volume.
          torrentio-definition:
            image: *image
            command:
              - sh
              - -c
              - |
                mkdir -p /config/Definitions/Custom &&
                curl -fsSL --retry 3 -o /config/Definitions/Custom/torrentio.yml.new \
                  https://raw.githubusercontent.com/dreulavelle/Prowlarr-Indexers/2b0f7eb72a64fe062186d1c284257010830daa7d/Custom/torrentio.yml &&
                mv /config/Definitions/Custom/torrentio.yml.new /config/Definitions/Custom/torrentio.yml ||
                echo "torrentio definition not updated, keeping the existing one"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: prowlarr
        ports:
          http:
            port: *port

    persistence:
      config:
        existingClaim: ${VOLSYNC_CLAIM}

    route:
      app:
        hostnames:
          - ${HOSTNAME}
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /api
            timeouts:
              request: 5m
              backendRequest: 5m
            backendRefs:
              - name: prowlarr
                port: *port
          - backendRefs:
              - name: prowlarr
                port: *port
