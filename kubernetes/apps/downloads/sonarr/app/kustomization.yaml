---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: downloads
resources:
  - ./helmrelease.yaml
  - ./externalsecret.yaml
  - ./networkpolicy.yaml

configMapGenerator:
  - name: sonarr-scripts
    files:
      - scripts/import.sh
      - scripts/reconcile.sh
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
configurations:
  - kustomizeconfig.yaml
