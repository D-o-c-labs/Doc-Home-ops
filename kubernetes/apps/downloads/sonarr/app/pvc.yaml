---
# Read-only content tree from the external media VM, re-served for the apps as
# NFSv3 on port 20492 with files owned by the app user and owner-writable (the
# export and this mount stay read-only). The direct export on 20490 reports
# every file as root-owned 0444, and the apps treat such a symlink target as
# read-only when they replace a file: they chmod it through the old symlink
# before deleting it, get EROFS and drop the upgrade. Static volume so it can
# set the port and be soft: a read that never returns fails with EIO after
# about 90 seconds (timeo 15 s, linear backoff, 2 retries) instead of hanging
# ffprobe and the whole import queue. Safe because read-only. nolock and
# mountport keep it to one port (no rpcbind, no lock manager); nosharecache
# keeps it apart from the other mounts of the same server on the node.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sonarr-external-media
spec:
  capacity:
    storage: 1Mi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=3
    - proto=tcp
    - port=20492
    - mountproto=tcp
    - mountport=20492
    - nolock
    - ro
    - soft
    - timeo=150
    - retrans=2
    - nosharecache
  nfs:
    server: external-media.piscio.net
    path: /
    readOnly: true
  claimRef:
    namespace: downloads
    name: sonarr-external-media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-external-media
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 1Mi
  storageClassName: ""
  volumeName: sonarr-external-media
---
# Remote download folder, read-only, served by the external media VM as NFSv3
# on port 20491. Static volume: the Talos nfsmount.conf section for this host
# forces NFSv4.0 on 20490, which only explicit mount options override. nolock
# and mountport keep it to that one port (no rpcbind, no lock manager). Soft
# like the external-media volume: a read that never returns fails with EIO
# after about 90 seconds instead of hanging the process. Safe because read-only.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sonarr-remote-library
spec:
  capacity:
    storage: 1Mi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=3
    - proto=tcp
    - port=20491
    - mountproto=tcp
    - mountport=20491
    - nolock
    - ro
    - soft
    - timeo=150
    - retrans=2
  nfs:
    server: external-media.piscio.net
    path: /
    readOnly: true
  claimRef:
    namespace: downloads
    name: sonarr-remote-library
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-remote-library
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 1Mi
  storageClassName: ""
  volumeName: sonarr-remote-library
