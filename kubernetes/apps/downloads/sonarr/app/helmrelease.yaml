---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-labs
        namespace: flux-system
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      sonarr:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          labels:
            egress.home.arpa/external-media: allow
            egress.home.arpa/internet: allow
            egress.home.arpa/kubedns: allow # FIXME: Remove when clusterNetworkPolicy is in place
            ingress.home.arpa/gateway-route: allow
          securityContext: &podSecurityContext
            runAsUser: ${APP_UID}
            runAsGroup: ${APP_GID}
            fsGroup: ${APP_GID}
            fsGroupChangePolicy: "OnRootMismatch"
            supplementalGroups:
              - 65542 # gladius:external-services

        containers:
          app:
            image: &image
              repository: ghcr.io/home-operations/sonarr
              tag: 5.0.0.2941@sha256:93b0923dd12afd43247739e19dac59d74c52a15ea12e036b7ced264cffb42574

            env:
              SONARR__INSTANCE_NAME: Sonarr
              SONARR__PORT: &port 8989
              SONARR__APPLICATION_URL: https://${HOSTNAME}
              SONARR__LOG_LEVEL: info
              SONARR__API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-secret
                    key: api_key

            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 2Gi

      # Unblocks upgrades and removes folders of deleted titles that Sonarr
      # cannot clean on the external library (scripts/reconcile.sh).
      reconcile:
        type: cronjob
        cronjob:
          schedule: "*/10 * * * *"
          backoffLimit: 0
          concurrencyPolicy: Forbid
          failedJobsHistory: 1
          successfulJobsHistory: 3
          ttlSecondsAfterFinished: 3600
        pod:
          labels:
            egress.home.arpa/kubedns: allow # FIXME: Remove when clusterNetworkPolicy is in place
          securityContext: *podSecurityContext
        containers:
          app:
            image: *image
            command:
              - /config/scripts/reconcile.sh
            env:
              ARR_APP: sonarr
              ARR_URL: http://sonarr.downloads.svc.cluster.local:8989
              ARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-secret
                    key: api_key
              LIBRARY_ROOT: /data/external-library/tv
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: sonarr
        ports:
          http:
            port: *port

    persistence:
      config:
        existingClaim: "${VOLSYNC_CLAIM}"
        advancedMounts:
          sonarr:
            app:
              - path: /config
      # Synology NAS mount disabled while the NAS is down (failed disks).
      # Restore it once the NAS is back.
      # media:
      #   type: nfs
      #   server: piscionas.piscio.net
      #   path: /volume1/Media
      #   globalMounts:
      #     - path: /data/nas-media
      # Read-only content tree served by the external media VM, needed to probe
      # the files behind the symlinks on import. Soft NFS mount (pvc.yaml).
      external-media:
        existingClaim: sonarr-external-media
        advancedMounts:
          sonarr:
            app:
              - path: /data/external-media
                readOnly: true
      # Symlink library exported by the external media VM: the download client
      # stages links in downloads/, the *arr moves them into its root folder.
      external-library:
        type: nfs
        server: external-library.piscio.net
        path: /data/external-library
        globalMounts:
          - path: /data/external-library
      # import.sh moves Decypharr symlinks on import; reconcile.sh runs in the
      # reconcile CronJob.
      scripts:
        type: configMap
        name: sonarr-scripts
        defaultMode: 0775
        globalMounts:
          - path: /config/scripts
      # Bash here-strings need a writable /tmp under readOnlyRootFilesystem.
      tmp:
        type: emptyDir
        advancedMounts:
          reconcile:
            app:
              - path: /tmp

    route:
      app:
        hostnames:
          - ${HOSTNAME}
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /api
            timeouts:
              request: 5m
              backendRequest: 5m
            backendRefs:
              - name: sonarr
                port: *port
          - backendRefs:
              - name: sonarr
                port: *port
