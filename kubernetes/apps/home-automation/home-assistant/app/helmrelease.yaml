---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-labs
        namespace: flux-system
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          labels:
            egress.home.arpa/internet: allow
            egress.home.arpa/kubedns: allow # FIXME: Remove when clusterNetworkPolicy is in place
            egress.home.arpa/lan: allow
            ingress.home.arpa/gateway-route: allow
            ingress.home.arpa/lan: allow
            egress.home.arpa/postgres-cluster: allow
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"multus-iot",
                "namespace": "network",
                "ips": ["192.168.40.2/24"]
              }]
          securityContext:
            runAsUser: ${APP_UID}
            runAsGroup: ${APP_GID}
            fsGroup: ${APP_GID}
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.10.4
            env:
              VENV_FOLDER: /venv

            envFrom:
              - secretRef:
                  name: home-assistant-db-secret

            probes:
              # HA can serve `/` while its internal API/event loop is wedged; probe a dynamic endpoint.
              # `/auth/providers` is unauthenticated (200) and used by the login page.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /auth/providers
                    port: 8123
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /auth/providers
                    port: 8123
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60

            resources:
              requests:
                cpu: 47m
                memory: 1536Mi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

          code-server:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.143.1@sha256:377b66bec5645510ed52549bb00e648c273edc604d230a3f90fd2b2433afcb97
            args:
              - --auth
              - none
              - --disable-telemetry
              - --disable-update-check
              - --user-data-dir
              - /config/.code-server
              - --extensions-dir
              - /config/.code-server
              - --port
              - "12321"
              - /config
            env:
              HASS_SERVER: http://localhost:8123
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi

          # Two-way sync of /config with GitHub; see git-sync/sync.sh.
          git-sync:
            image:
              repository: docker.io/alpine/git
              tag: v2.54.0@sha256:e8ceedc73bd80992ae8d58a7d24c58b8322146c354f1d2e81a97db4452068ec0
            command:
              - /bin/sh
              - /etc/git-sync/sync.sh
            env:
              GIT_REMOTE_URL: git@github.com:D-o-c/Home-Assistant.git
              GIT_BRANCH: master
              GIT_AUTHOR_NAME: &gitName Home Assistant
              GIT_AUTHOR_EMAIL: &gitEmail 8810257+D-o-c@users.noreply.github.com
              GIT_COMMITTER_NAME: *gitName
              GIT_COMMITTER_EMAIL: *gitEmail
              HASS_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: homeassistant-secrets
                    key: LLToken
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: home-assistant
        ports:
          http:
            port: &httpPort 8123
            primary: true
          code-server:
            port: &codePort 12321

    persistence:
      config:
        existingClaim: "${VOLSYNC_CLAIM}"
        advancedMounts:
          home-assistant:
            app:
              - path: /config
            code-server:
              - path: /config
            git-sync:
              - path: /config
      git-sync:
        type: configMap
        name: home-assistant-git-sync
        advancedMounts:
          home-assistant:
            git-sync:
              - path: /etc/git-sync
                readOnly: true
      deploy-key:
        type: secret
        name: home-assistant-deploykey
        defaultMode: 288 # 0440: readable through fsGroup; sync.sh copies it to 0600
        advancedMounts:
          home-assistant:
            git-sync:
              - path: /secrets/ssh
                readOnly: true
      hass-cache:
        existingClaim: hass-cache
        advancedMounts:
          home-assistant:
            app:
              - path: /venv
                subPath: hass-venv
      tmpfs:
        type: emptyDir
        advancedMounts:
          home-assistant:
            app:
              - path: /tmp
                subPath: hass-tmp
            code-server:
              - path: /tmp
                subPath: code-server-tmp
              - path: /nonexistent
                subPath: nonexistent
            git-sync:
              - path: /tmp
                subPath: git-sync-tmp

    route:
      app:
        hostnames:
          - ${HOSTNAME}
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: home-assistant
                port: *httpPort
      code-server:
        hostnames:
          - code-homeassistant.piscio.net
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: home-assistant
                port: *codePort
