---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-labs
        namespace: flux-system
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      n8n:
        annotations:
          # Restart pods when the DB secret is updated (envFrom is only evaluated at container start).
          secret.reloader.stakater.com/reload: n8n-db-secret

        pod:
          labels:
            egress.home.arpa/internet: allow
            egress.home.arpa/kubedns: allow # FIXME: Remove when clusterNetworkPolicy is in place
            egress.home.arpa/postgres-cluster: allow
            ingress.home.arpa/gateway-route: allow
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true

        containers:
          app:
            image:
              repository: n8nio/n8n
              tag: 2.45.4@sha256:80e23ced901f0e22597d4f3464e3aaf9d835372262ea6f08ef760d8ca35df25c
            env:
              N8N_EDITOR_BASE_URL: "https://${EDITOR_HOSTNAME}"
              VUE_APP_URL_BASE_API: "https://${EDITOR_HOSTNAME}"
              WEBHOOK_URL: "https://${HOSTNAME}"
              N8N_METRICS: "true"
              NODE_ENV: "production"
              NODE_FUNCTION_ALLOW_EXTERNAL: "cheerio"
              N8N_RUNNERS_ENABLED: true
              N8N_BLOCK_ENV_ACCESS_IN_NODE: true
            envFrom:
              - secretRef:
                  name: n8n-db-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1024Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: n8n
        ports:
          http:
            port: &port 5678

    persistence:
      config:
        existingClaim: "${VOLSYNC_CLAIM}"
        advancedMounts:
          n8n:
            app:
              - path: /home/node/.n8n
                readOnly: false

    route:
      # Public: only webhook and form endpoints. The editor, REST API and /metrics stay on the LAN.
      app:
        hostnames:
          - ${HOSTNAME}
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /webhook
              - path:
                  type: PathPrefix
                  value: /webhook-test
              - path:
                  type: PathPrefix
                  value: /webhook-waiting
              - path:
                  type: PathPrefix
                  value: /form
              - path:
                  type: PathPrefix
                  value: /form-test
              - path:
                  type: PathPrefix
                  value: /form-waiting
            backendRefs:
              - name: n8n
                port: *port
      editor:
        hostnames:
          - ${EDITOR_HOSTNAME}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: n8n
                port: *port
