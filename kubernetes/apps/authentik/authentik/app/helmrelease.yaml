---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      version: 2026.8.5
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
  values:
    global:
      deploymentAnnotations:
        secret.reloader.stakater.com/reload: authentik-secret,authentik-db-secret

      image:
        repository: ghcr.io/goauthentik/server
        tag: 2026.8.5

      envFrom:
        - secretRef:
            name: authentik-db-secret
        - secretRef:
            name: authentik-secret

    authentik:
      log_level: info
      email:
        port: 587
        use_tls: true
      error_reporting:
        enabled: false
        send_pii: false
      web:
        # Required from 2026.11
        base_url: https://${HOSTNAME}

    server:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

    postgresql:
      enabled: false

    prometheus:
      rules:
        enabled: true
