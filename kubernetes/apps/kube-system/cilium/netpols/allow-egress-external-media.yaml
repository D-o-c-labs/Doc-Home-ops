---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-external-media
spec:
  endpointSelector:
    matchLabels:
      egress.home.arpa/external-media: allow
  egress:
    # External media VM (external-media.piscio.net): download client API only.
    # The NFS exports (2049, 20490) are mounted by the kubelet from the host
    # network, not from pods.
    - toCIDRSet:
        - cidr: 192.168.32.202/32
      toPorts:
        - ports:
            - port: "8282"
              protocol: TCP
